name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make lint test check-generated package
      - uses: actions/upload-artifact@v4
        with:
          name: telluric-horizons-unverified-dev
          path: dist/*.zip
